<script>
  /* 应急回退：?legacy=1 直接跳转冻结的旧版单页 legacy.html */
  (function () {
    if (location.search.indexOf('legacy=1') !== -1) {
      location.replace('legacy.html' + location.hash);
    }
  })();

  /* V2 视觉开关（2026-09-06 全量放开）：默认就是新视觉，无需任何参数。
     原链接与已保存的二维码不含参数，扫出来即新版 —— 二维码不用重新生成。
     ?v2=0 可切回旧版并记住，?v2=1 切回新版。
     必须在 head 内联执行 —— 若等 CSS/JS 加载后再加类，会出现先用旧样式渲染再跳变的闪烁。
     新样式全部写在 css/wallpaper.css 末尾的 html.v2 作用域内，本脚本只负责加一个类名，
     不触碰任何业务逻辑，删掉这几行即完全回到旧版。 */
  (function () {
    try {
      var q = location.search || "";
      var root = document.documentElement;
      /* 放开当日清一次历史选择：试点期间点过 ?v2=0 的人（包括主理人自己）
         否则会被永久留在旧版。pilot-v2-lock 保证这次清理只做一次，
         之后用户自己的主动选择照常生效，不会被反复重置。 */
      if (localStorage.getItem("pilot-v2-lock") !== "2026-09-06") {
        localStorage.removeItem("pilot-v2");
        localStorage.setItem("pilot-v2-lock", "2026-09-06");
      }
      var on = localStorage.getItem("pilot-v2") !== "0";
      if (q.indexOf("v2=1") !== -1) { on = true; localStorage.setItem("pilot-v2", "1"); }
      else if (q.indexOf("v2=0") !== -1) { on = false; localStorage.setItem("pilot-v2", "0"); }
      if (on) root.className = (root.className ? root.className + " " : "") + "v2";
    } catch (e) { /* 隐私模式等 localStorage 不可用时，静默退回旧版 */ }
  })();

  /* 顺捷感三件套总开关（2026-09-07）：默认全部开启。
     ?smooth=0  一键关闭全部三项并记住（线上出问题时的 30 秒止血开关）
     ?smooth=1  恢复开启
     ?audit=1   删除恢复「必填理由」模式，满足审计留痕要求
     与上方 v2 开关同模式：只设置一个标志位，不碰任何业务逻辑；
     删掉这一段，所有 Util.feature() 一律返回 true（缺省即开启）。 */
  (function () {
    window.App = window.App || {};
    window.App.FEATURES = { fastDelete: true, swipe: true, optimistic: true, requireReason: false };
    try {
      var q = location.search || "";
      var v = localStorage.getItem("pilot-smooth");
      var on = (v !== "0");
      if (q.indexOf("smooth=0") !== -1) { on = false; localStorage.setItem("pilot-smooth", "0"); }
      else if (q.indexOf("smooth=1") !== -1) { on = true; localStorage.setItem("pilot-smooth", "1"); }
      if (q.indexOf("audit=1") !== -1) window.App.FEATURES.requireReason = true;
      if (!on) window.App.FEATURES = { fastDelete: false, swipe: false, optimistic: false, requireReason: false };
    } catch (e) { /* 隐私模式等 localStorage 不可用时，保持默认全开 */ }
  })();

  /* 版本自检：GitHub Pages 无法下发 Cache-Control 头，页面长时间挂着可能跑旧版 JS。
     部署时把短 SHA 写入 <meta build-ver> 与 version.txt（见 deploy.yml），
     此处对比两者，不一致说明页面是旧版 → 强制 reload 拉到最新资源。
     注意：仅在「部署环境」（build-ver 是 8 位 SHA）生效；本地直开 index.html 时占位符未替换，跳过。 */
  (function () {
    var cur = (document.querySelector('meta[name="build-ver"]') || {}).getAttribute
      ? document.querySelector('meta[name="build-ver"]').getAttribute('content')
      : "";
    if (!cur || cur.indexOf("__") !== -1 || !/^[0-9a-f]{8}$/.test(cur)) return;
    var done = false;
    var lastCheck = 0;
    function check() {
      if (done) return;
      var now = Date.now();
      if (now - lastCheck < 300000) return;
      lastCheck = now;
      fetch("version.txt?_=" + now, { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (txt) {
          var ver = String(txt || "").trim();
          if (ver && ver !== cur) { done = true; location.reload(); }
        })
        .catch(function () {});
    }
    if (document.visibilityState === "visible") check();
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") check();
    });
    window.addEventListener("focus", check);
  })();

  /* PWA 离线：注册 Service Worker（优化 3）。
     仅部署环境注册（https + 非 file://）；本地直开跳过。
     注册失败静默（浏览器不支持 / 隐私模式等），不影响页面功能。 */
  (function () {
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost") return;
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  })();

  /* 全局错误兜底（2026-09-06 调整）：主理人明确要求不再弹出
     「页面有部分功能未能正常加载 / 异步操作失败」错误条，
     改为仅写入浏览器控制台（console.warn），排查时在 F12 看，页面上不再出现任何遮挡提示。
     保留 window.__reportFatal 供 main.js 启动失败时复用（同样只记日志）。 */
  (function () {
    function report(msg) {
      if (!msg) return;
      try { console.warn("[app]", String(msg).slice(0, 300)); } catch (e) {}
    }
    window.addEventListener('error', function (e) {
      // 资源加载失败不冒泡到 window.onerror，只能在捕获阶段从 e.target 识别
      var t = e.target;
      if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK' || t.tagName === 'IMG')) {
        report('资源加载失败 ' + String(t.src || t.href || '').split('/').slice(-2).join('/'));
        return;
      }
      report((e.message || '未知错误') +
        (e.lineno ? ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno : ''));
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      report('异步操作失败：' + ((r && (r.message || r.msg)) || r || '未知原因'));
    });

    window.__reportFatal = report;     // 供 main.js 启动失败时复用
  })();
</script>
</head>
<body>
  <!-- 双页容器：落地页（免密出库表单）/ 管理页（Windows 桌面壳） -->
  <div id="view-landing" class="view-page">
    <div class="landing-skeleton" style="min-height:100vh;background:var(--bg, linear-gradient(160deg,#F1F8F4,#FBF9F3,#F0F6F5));display:flex;flex-direction:column;align-items:center;padding:80px 20px;gap:24px;animation:sk-fade .5s ease-out;">
      <div style="width:160px;height:22px;border-radius:999px;background:linear-gradient(90deg,var(--mint-100,#EAF4EF) 25%,var(--mint-200,#D9EADF) 50%,var(--mint-100,#EAF4EF) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s infinite;"></div>
      <div style="width:100%;max-width:760px;height:320px;border-radius:24px;background:linear-gradient(90deg,var(--mint-100,#EAF4EF) 25%,var(--mint-200,#D9EADF) 50%,var(--mint-100,#EAF4EF) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s infinite;"></div>
      <div style="width:100%;max-width:760px;height:160px;border-radius:24px;background:linear-gradient(90deg,var(--mint-100,#EAF4EF) 25%,var(--mint-200,#D9EADF) 50%,var(--mint-100,#EAF4EF) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s infinite;"></div>
    </div>
    <style>
      @keyframes sk-fade { from { opacity:0 } to { opacity:1 } }
      @keyframes sk-shimmer { to { background-position:-200% 0 } }
    </style>
  </div>
  <div id="view-app" class="view-page" style="display:none">
    <div class="app-skeleton" style="height:100vh;display:flex;flex-direction:column;background:var(--bg, linear-gradient(160deg,#F1F8F4,#FBF9F3,#F0F6F5));">
      <div style="height:50px;background:linear-gradient(90deg,var(--mint-100,#EAF4EF) 25%,var(--mint-200,#D9EADF) 50%,var(--mint-100,#EAF4EF) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s infinite;"></div>
      <div style="flex:1;display:flex;">
        <div style="width:232px;background:linear-gradient(90deg,var(--mint-100,#EAF4EF) 25%,var(--mint-200,#D9EADF) 50%,var(--mint-100,#EAF4EF) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s infinite;"></div>
        <div style="flex:1;padding:20px;display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start;">
          <div style="width:calc(25% - 11px);min-width:160px;height:100px;border-radius:12px;background:linear-gradient(90deg,var(--mint-100,#EAF4EF) 25%,var(--mint-200,#D9EADF) 50%,var(--mint-100,#EAF4EF) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s infinite;"></div>
          <div style="width:calc(25% - 11px);min-width:160px;height:100px;border-radius:12px;background:linear-gradient(90deg,var(--mint-100,#EAF4EF) 25%,var(--mint-200,#D9EADF) 50%,var(--mint-100,#EAF4EF) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s infinite;"></div>
          <div style="width:calc(25% - 11px);min-width:160px;height:100px;border-radius:12px;background:linear-gradient(90deg,var(--mint-100,#EAF4EF) 25%,var(--mint-200,#D9EADF) 50%,var(--mint-100,#EAF4EF) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s infinite;"></div>
          <div style="width:calc(25% - 11px);min-width:160px;height:100px;border-radius:12px;background:linear-gradient(90deg,var(--mint-100,#EAF4EF) 25%,var(--mint-200,#D9EADF) 50%,var(--mint-100,#EAF4EF) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s infinite;"></div>
          <div style="width:100%;height:300px;border-radius:12px;background:linear-gradient(90deg,var(--mint-100,#EAF4EF) 25%,var(--mint-200,#D9EADF) 50%,var(--mint-100,#EAF4EF) 75%);background-size:200% 100%;animation:sk-shimmer 1.4s infinite;"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 弹窗与提示容器 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- 云端令牌：由部署 workflow 用 perl 将「令牌值占位符」替换为仓库密匙（Secrets.GH_TOKEN），
       任何设备打开即自带写入能力。localStorage 中的 gh_token 仅作兜底。
       注意：变量名 window.__GH_TOKEN__ 保持不变（外部 config.js 依赖它），
       仅替换下方赋值语句的值占位符，避免 perl 全局替换误伤变量名。
       此占位必须保持内联脚本，不得移入外部 js / 构建产物。 -->
  <script>
    window.__GH_TOKEN__ = "__GH_TOKEN_PLACEHOLDER__";
  </script>

  <!-- 经典 <script> 顺序加载（不用 ES Module，保证 file:// 调试与加载顺序） -->
  <!-- 首屏提速改造（2026-09-23）：原 45 个外链脚本已按「原顺序」合并压缩为下面 1 个 bundle，
       请求数 46 → 1。原因：GitHub Pages 走 HTTP/1.1、同域仅 6 并发，45 个请求实测墙钟 3 秒以上，
       弱网/微信内置浏览器更久，扫码用户会误判成「没扫上」。
       源文件全部完整保留在 src/js/ 下，未删除任何功能；bundle 由脚本生成，请勿手改（改源文件后重新生成）。
       下列文件名保留在本注释中，供 deploy.yml 防回滚守卫 grep 校验（对应功能均在 bundle 内）：
         js/views/trash.js（回收站视图）、js/views/push.js（推送信息视图）、sw.js（见页首内联注册脚本）
       原注释备忘（合并顺序已保持）：js/data/product-map.js 为商品映射「单一真相源」，须在 config.js 前加载；
       js/ui/icons.js 为 V2 试点 emoji→SVG 图标替换，真判断 <html class="v2"> 后 return；
       js/ui/dingtalk.js、js/views/report.js、js/ai/* 原为 fetchpriority="low"；
       sound.js 已于 2026-09-06 按主理人要求移除。 -->
  <script>
    /* 首屏等待与失败兜底（2026-09-23 新增等待提示；2026-09-25 增加「加载失败」兜底）
       覆盖两种"看不到界面"的情形，都不遮挡、不残留：
         A. 慢：可见骨架屏持续超过 8 秒 → 顶部胶囊提示 + 点此重试；
         B. 坏：核心脚本（app.bundle.js）本身加载失败或执行报错 → 立刻全屏兜底卡片 + 重试/清理缓存。
       可见性用 offsetParent 判断：被 display:none 隐藏的骨架屏（如未激活的 #view-app）不算「还在加载」。 */
    (function () {
      var el = null, tick = null, failed = false;
      function booting() {
        var ls = document.querySelector('.landing-skeleton');
        var as = document.querySelector('.app-skeleton');
        return (ls && ls.offsetParent !== null) || (as && as.offsetParent !== null);
      }
      function drop() {
        if (tick) { clearInterval(tick); tick = null; }
        if (el && el.parentNode) el.parentNode.removeChild(el);
        el = null;
      }
      /* B. 加载失败兜底：脚本 onerror / 未捕获异常 / 启动超时，任一命中即展示兜底页 */
      function failFast(reason) {
        if (failed || !booting()) return;
        failed = true;
        drop();
        var box = document.createElement('div');
        box.id = 'boot-fail';
        box.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;' +
          'justify-content:center;padding:20px;box-sizing:border-box;background:linear-gradient(160deg,#F1F8F4,#FBF9F3,#F0F6F5)';
        box.innerHTML = '<div style="max-width:420px;width:100%;background:#fff;border-radius:18px;' +
          'padding:26px 22px;box-shadow:0 10px 30px rgba(60,72,69,.14);font:14px/1.75 -apple-system,' +
          'BlinkMacSystemFont,\'PingFang SC\',\'Microsoft YaHei\',sans-serif;color:#3C4845;text-align:center">' +
          '<div style="font-size:34px;line-height:1">📡</div>' +
          '<div style="font-size:17px;font-weight:700;margin:10px 0 6px">页面没能加载出来</div>' +
          '<div style="color:#6B7A75;font-size:13px">' + (reason || '可能是网络不稳或缓存过期') +
          '。点下面按钮重试即可，你的数据都安全地存在云端和本机，不会因为这一次失败丢掉。</div>' +
          '<button id="boot-fail-retry" style="margin-top:18px;width:100%;border:0;border-radius:999px;' +
          'padding:12px 16px;background:linear-gradient(120deg,#A79ED0,#7FB3A5);color:#fff;font-weight:700;' +
          'font-size:15px;cursor:pointer">重新加载</button>' +
          '<button id="boot-fail-clear" style="margin-top:9px;width:100%;border:1px solid #D8E5DF;' +
          'border-radius:999px;padding:11px 16px;background:#fff;color:#4A5A55;font-weight:600;' +
          'font-size:14px;cursor:pointer">清理缓存后重新加载</button></div>';
        document.body.appendChild(box);
        var r = document.getElementById('boot-fail-retry');
        if (r) r.onclick = function () { location.reload(); };
        var c = document.getElementById('boot-fail-clear');
        if (c) c.onclick = function () { clearAndReload(c); };
      }
      /* 清理缓存：优先让 Service Worker 清掉自身缓存，再带 ?_r= 时间戳强刷，绕过边缘缓存 */
      function clearAndReload(btn) {
        if (btn) { btn.disabled = true; btn.textContent = '正在清理…'; }
        var go = function () { location.replace(location.pathname + '?_r=' + Date.now()); };
        try {
          if (window.caches && caches.keys) {
            caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }).then(go).catch(go);
            return;
          }
        } catch (e) {}
        setTimeout(go, 150);
      }
      window.__bootFail = failFast;
      window.addEventListener('error', function (ev) {
        var t = ev && ev.target;
        if (t && t.tagName === 'SCRIPT') { failFast('核心脚本没能下载完成'); return; }
        if (ev && ev.message) failFast('页面脚本出现异常');
      }, true);
      window.addEventListener('unhandledrejection', function () { failFast('页面脚本出现异常'); });
      setTimeout(function () {
        if (booting()) failFast('加载超时（超过 15 秒）');
      }, 15000);
      /* A. 慢：8 秒仍在骨架屏 → 胶囊提示 + 重试 */
      setTimeout(function () {
        if (failed || !booting()) return;
        var t0 = Date.now();
        el = document.createElement('div');
        el.id = 'boot-hint';
        el.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:99999;' +
          'max-width:92vw;box-sizing:border-box;text-align:center;font:13px/1.7 -apple-system,BlinkMacSystemFont,' +
          '"PingFang SC","Microsoft YaHei",sans-serif;background:rgba(60,72,69,.92);color:#fff;' +
          'padding:9px 16px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.2)';
        el.innerHTML = '网络较慢，正在加载… <span id="boot-hint-sec">8</span>s' +
          '<button id="boot-hint-retry" style="margin-left:8px;border:0;border-radius:999px;padding:5px 13px;' +
          'background:#9CCBB0;color:#20423A;font-weight:700;font-size:13px">点此重试</button>';
        document.body.appendChild(el);
        var btn = document.getElementById('boot-hint-retry');
        if (btn) btn.onclick = function () { location.reload(); };
        tick = setInterval(function () {
          if (!booting()) { drop(); return; }
          var s = document.getElementById('boot-hint-sec');
          if (s) s.textContent = Math.round((Date.now() - t0) / 1000) + 8;
        }, 500);
        setTimeout(drop, 60000);
      }, 8000);
    })();
  </script>
  <script defer src="js/app.bundle.js?v=__CACHE_BUST__"></script>
</body>
</html>
