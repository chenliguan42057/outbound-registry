<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>出入库登记表</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --primary: #2f6fed;
    --primary-dark: #1f54c4;
    --text: #1f2733;
    --muted: #6b7785;
    --border: #e3e8ef;
    --danger: #e5484d;
    --ok: #2ea043;
    --chip: #eef3ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 22px;
    box-shadow: 0 1px 2px rgba(16,24,40,.04);
  }
  .card h2 { font-size: 16px; margin: 0 0 16px; display:flex; align-items:center; gap:8px;}
  .card h2 .tag { font-size:11px; font-weight:500; color:var(--primary); background:var(--chip); padding:2px 8px; border-radius:999px;}
  label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
  label .req { color: var(--danger); margin-left:2px;}
  input[type=text], input[type=datetime-local], input[type=number], textarea, .search {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text);
    background: #fff;
  }
  input:focus, textarea:focus, .search:focus { outline: none; border-color: var(--primary); box-shadow:0 0 0 3px rgba(47,111,237,.12); }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .field { margin-bottom: 14px; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; }
  .auto { font-size:12px; color:var(--primary); cursor:pointer; user-select:none; }

  /* product search */
  .search-wrap { position: relative; }
  .suggest {
    position:absolute; top:100%; left:0; right:0; z-index:20;
    background:#fff; border:1px solid var(--border); border-radius:8px;
    max-height: 220px; overflow:auto; box-shadow:0 6px 18px rgba(16,24,40,.12);
  }
  .suggest div { padding:10px 12px; font-size:14px; cursor:pointer; }
  .suggest div:hover { background:var(--chip); }
  .selected { display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .sel-item {
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--border); border-radius:8px; padding:10px 12px; background:#fafbfc;
    flex-wrap:nowrap;
  }
  .sel-item .name { flex:1 1 auto; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sel-item input { width:110px; flex:0 0 auto; }
  .sel-item .x { cursor:pointer; color:var(--muted); font-size:18px; line-height:1; padding:0 4px;}
  .sel-item .x:hover { color:var(--danger); }
  /* 入库弹窗内产品名独占一行，避免被压缩或截断 */
  #inModal .sel-item { flex-wrap:wrap; align-items:flex-start; }
  #inModal .sel-item .name { flex:1 1 100%; white-space:normal; margin-bottom:6px; }
  #inModal .sel-item input { flex:1 1 auto; width:auto; min-width:80px; }

  /* photos */
  .photo-drop {
    border: 1.5px dashed var(--border);
    border-radius:10px; padding:16px; text-align:center; color:var(--muted); cursor:pointer;
    transition:.15s; background:#fafbfc;
  }
  .photo-drop:hover { border-color:var(--primary); color:var(--primary); background:var(--chip); }
  .thumbs { display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
  .thumb {
    position:relative; width:84px; height:84px; border-radius:8px; overflow:hidden;
    border:1px solid var(--border); background:#fff;
  }
  .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb .del {
    position:absolute; top:2px; right:2px; width:20px; height:20px; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; font-size:13px; line-height:20px; text-align:center; cursor:pointer;
  }
  .photo-meta { font-size:12px; color:var(--muted); margin-top:8px; }

  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 18px; border-radius:8px; border:1px solid var(--primary);
    background:var(--primary); color:#fff; font-size:14px; cursor:pointer; font-weight:500;
  }
  .btn:hover { background:var(--primary-dark); border-color:var(--primary-dark); }
  .btn.ghost { background:#fff; color:var(--primary); }
  .btn.ghost:hover { background:var(--chip); }
  .btn.sm { padding:5px 10px; font-size:13px; }
  .btn.danger { background:#fff; color:var(--danger); border-color:var(--border); }
  .btn.danger:hover { background:#fff0f0; border-color:var(--danger); }
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:6px; }

  /* list */
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
  th { color:var(--muted); font-weight:600; font-size:12px; background:#fafbfc; }
  .items-cell { max-width:240px; }
  .item-line { white-space:nowrap; }
  .item-line.multi-line { border-bottom: 1px dashed var(--border); padding-bottom: 6px; margin-bottom: 6px; }
  .item-line.multi-line:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .photos-cell { display:flex; gap:4px; flex-wrap:wrap; }
  .mini-photo { width:34px; height:34px; border-radius:6px; object-fit:cover; cursor:pointer; border:1px solid var(--border); }
  .empty { text-align:center; color:var(--muted); padding:28px 0; font-size:14px; }
  .badge { display:inline-block; font-size:11px; color:var(--muted); background:var(--chip); border-radius:6px; padding:1px 6px; }
  .sync { font-size:12px; font-weight:400; color:var(--ok); margin-left:8px; }
  .sync.err { color:var(--danger); }
  .sync.info { color:var(--muted); }

  /* modal */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal.show { display:flex; }
  .modal img { max-width:92vw; max-height:88vh; border-radius:8px; background:#fff; }
  .modal .close { position:absolute; top:18px; right:24px; color:#fff; font-size:30px; cursor:pointer; }

  /* password modal */
  .pw-box { background:#fff; border-radius:12px; padding:22px; width:300px; max-width:90vw; box-shadow:0 10px 40px rgba(0,0,0,.25); }
  .pw-title { font-size:15px; font-weight:600; margin-bottom:14px; }
  .pw-box input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:15px; }
  .pw-actions { display:flex; gap:10px; margin-top:16px; }
  .pw-actions .btn { flex:1; justify-content:center; }
  .pw-err { color:var(--danger); font-size:12px; margin-top:10px; min-height:14px; }

  .toast {
    position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px);
    background:#1f2733; color:#fff; padding:10px 18px; border-radius:8px; font-size:14px;
    opacity:0; pointer-events:none; transition:.2s; z-index:60;
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  .toast.err { background:var(--danger); }
  @media (max-width:560px){
    .grid2{grid-template-columns:1fr;}
    input[type=text], input[type=datetime-local], input[type=number], textarea, .search { font-size:16px; }
    .btn{ width:100%; }
    .actions .btn{ width:auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>出入库登记表</h1>
  <div class="sub">现场出库 / 入库登记与库存管理</div>
  
<div class="card">
    <h2>新增登记 <span class="tag">基础登记</span></h2>
    <div class="field">
      <label>部门 / 领取单位<span class="req">*</span></label>
      <div class="search-wrap">
        <input type="text" id="dept" placeholder="请输入部门 / 领取单位" autocomplete="off" />
        <div class="suggest" id="deptSuggest"></div>
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>领取时间<span class="req">*</span></label>
        <input type="datetime-local" id="time" />
        <div class="hint"><span class="auto" id="fillNow">📎 自动填入当前时间</span></div>
      </div>
      <div class="field">
        <label>领取人<span class="req">*</span></label>
        <div class="search-wrap">
          <input type="text" id="picker" placeholder="请输入领取人姓名" autocomplete="off" />
          <div class="suggest" id="pickerSuggest"></div>
        </div>
      </div>
    </div>
    <div class="field">
      <label>用途 / 项目<span class="req">*</span></label>
      <input type="text" id="purpose" placeholder="请输入用途或项目（必填）" />
    </div>

    <div class="field">
      <label>货物名称<span class="req">*</span></label>
      <div class="search-wrap">
        <input type="text" class="search" id="search" placeholder="搜索并选择货品（可多选，每个单独填数量）" autocomplete="off" />
        <div class="suggest" id="suggest"></div>
      </div>
      <div class="selected" id="selected"></div>
      <div class="hint" id="selHint">尚未选择货品，请在上方搜索并选择。</div>
    </div>

    <div class="field">
      <label>现场照片（留存）</label>
      <div class="photo-drop" id="photoDrop">
        📷 点击或拖拽上传照片，作为现场留存凭证（可多张）
      </div>
      <input type="file" id="photoInput" accept="image/*" multiple hidden />
      <div class="thumbs" id="thumbs"></div>
      <div class="photo-meta" id="photoMeta"></div>
    </div>

    <div class="actions">
      <button class="btn" id="submit">提交登记</button>
      <button class="btn ghost" id="reset">清空</button>
      <button class="btn ghost" id="cancelEdit" style="display:none;">取消编辑</button>
    </div>
  </div>

  <div class="card">
    <h2>记录列表 <span class="badge" id="count">0 条</span>
      <span class="sync" id="syncStatus"></span>
      <button class="btn ghost sm" id="syncBtn" style="margin-left:8px;">🔄 立即同步</button>
    </h2>
    <div class="actions" style="margin-bottom:12px;">
      <button class="btn ghost sm" id="exportBtn">⬇ 导出 CSV</button>
      <button class="btn ghost sm" id="inBtn">⬆ 入库</button>
      <button class="btn ghost sm" id="stockBtn">📦 查看库存</button>
      <button class="btn danger sm" id="clearAll">清空全部记录</button>
    </div>
    <div class="hint" id="syncHint">数据已同步到云端：换设备（手机/电脑）打开同一网址即可看到相同记录。</div>
    <div id="listBox"></div>
  </div>
</div>

<div class="modal" id="modal"><span class="close" id="modalClose">&times;</span><img id="modalImg" alt="" /></div>
<div class="toast" id="toast"></div>
<div class="modal" id="pwModal">
  <div class="pw-box">
    <div class="pw-title" id="pwTitle">此操作需要密码</div>
    <input type="password" id="pwInput" placeholder="请输入密码" />
    <div class="pw-actions">
      <button class="btn sm" id="pwConfirm">确认</button>
      <button class="btn ghost sm" id="pwCancel">取消</button>
    </div>
    <div class="pw-err" id="pwErr"></div>
  </div>
</div>

<div class="modal" id="inModal">
  <div class="pw-box" style="width:520px;max-width:96vw;">
    <div class="pw-title">入库登记</div>
    <div class="field">
      <label>货品名称<span class="req">*</span></label>
      <div class="search-wrap">
        <input type="text" class="search" id="inSearch" placeholder="搜索并选择货品（可多选，每个单独填数量）" autocomplete="off" />
        <div class="suggest" id="inSuggest"></div>
      </div>
      <div class="selected" id="inSelected"></div>
      <div class="hint" id="inSelHint">尚未选择货品，请在上方搜索并选择。</div>
    </div>
    <div class="actions">
      <button class="btn sm" id="inConfirm">确定入库</button>
      <button class="btn ghost sm" id="inCancel">取消</button>
    </div>
  </div>
</div>

<div class="modal" id="stockModal">
  <div class="pw-box" style="width:520px;max-width:96vw;">
    <div class="pw-title">当前库存详情</div>
    <div id="stockList" style="max-height:60vh;overflow:auto;"></div>
    <div class="actions" style="margin-top:14px;">
      <button class="btn ghost sm" id="stockClose">关闭</button>
    </div>
  </div>
</div>

<script>
window.__GH_TOKEN__ = "__GH_TOKEN__";
const PRODUCTS = [
  "冻干精华液 20支装","冻干精华液 5支装","冻干精华液 单支装","面膜 5片装","面膜 1片装",
  "冻干精华液 30支装","洁面慕斯 150ml","洁面慕斯 50ml","舒缓精粹水 120ml","舒缓精粹水 30ml",
  "赋活精粹乳 80ml","赋活精粹乳 30ml","赋活精粹乳 1ml","舒缓精粹霜 50g","舒缓精粹霜 15g","舒缓精粹霜 5g","舒缓精粹霜 1g",
  "华大鹿茸凝时系列礼盒装",
  "小鹿牛皮纸袋（全系列护肤品手提袋）大",
  "小鹿牛皮纸袋（精华+面膜手提袋）小"
];
const INVENTORY = {
  "冻干精华液 20支装":102,"冻干精华液 5支装":325,"冻干精华液 单支装":234,"面膜 5片装":140,"面膜 1片装":219,
  "冻干精华液 30支装":43,"洁面慕斯 150ml":89,"洁面慕斯 50ml":78,"舒缓精粹水 120ml":62,"舒缓精粹水 30ml":53,
  "赋活精粹乳 80ml":90,"赋活精粹乳 30ml":68,"赋活精粹乳 1ml":125,"舒缓精粹霜 50g":61,"舒缓精粹霜 15g":84,"舒缓精粹霜 5g":100,"舒缓精粹霜 1g":127,
  "华大鹿茸凝时系列礼盒装":5,
  "小鹿牛皮纸袋（全系列护肤品手提袋）大":199,
  "小鹿牛皮纸袋（精华+面膜手提袋）小":147
};
const STORE_KEY = "outbound_records_v2";

/* ===================== 云端同步（GitHub Contents API） ===================== */
/* 数据存在仓库的 data/records/<id>.json，换设备打开同一网址即看到同一份记录。 */
const GH = {
  repo: "chenliguan42057/outbound-registry",
  branch: "main",
  dir: "data/records",
  /* 云端写入令牌：由部署时从仓库密匙注入到页面（window.__GH_TOKEN__），任何设备打开即自带写入能力，
     无需在页面手动配置。localStorage 中的 gh_token 仅作为兜底。 */
  token: (window.__GH_TOKEN__ && window.__GH_TOKEN__.indexOf("__") !== 0) ? window.__GH_TOKEN__ : (localStorage.getItem("gh_token") || "")
};
let STATE = { list: [], lastSync: null };

function getStock(name) {
  const init = INVENTORY[name] || 0;
  let inQty = 0, outQty = 0;
  STATE.list.forEach(r => {
    (r.items || []).forEach(it => {
      if (it.name !== name) return;
      const q = Number(it.qty) || 0;
      if (r.type === "in") inQty += q; else outQty += q;
    });
  });
  return init + inQty - outQty;
}

function ghHeaders() {
  const h = { "Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" };
  if (GH.token && GH.token.indexOf("__") !== 0) h["Authorization"] = "Bearer " + GH.token;
  return h;
}
function b64enc(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64dec(b64) { return decodeURIComponent(escape(atob(String(b64).replace(/\s/g, "")))); }
function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function setSync(text, isErr, info) {
  const el = document.getElementById("syncStatus");
  if (el) { el.textContent = text || ""; el.className = "sync" + (isErr ? " err" : (info ? " info" : "")); }
}
async function apiJson(url, opts) {
  const res = await fetch(url, Object.assign({ headers: ghHeaders() }, opts || {}));
  if (!res.ok) { const t = await res.text().catch(() => ""); throw new Error(res.status + " " + t.slice(0, 80)); }
  return res.json();
}
async function cloudPull() {
  const url = `https://api.github.com/repos/${GH.repo}/contents/${GH.dir}?ref=${GH.branch}`;
  let arr;
  try { arr = await apiJson(url); }
  catch (e) { if (String(e.message).indexOf("404") === 0) return []; throw e; }
  if (!Array.isArray(arr)) return [];
  const files = arr.filter(f => f.name.endsWith(".json") && f.size < 5 * 1024 * 1024);
  const recs = [];
  for (const f of files) {
    try { const j = await apiJson(f.url); recs.push(JSON.parse(b64dec(j.content))); } catch (e) {}
  }
  return recs;
}
async function cloudPush(rec) {
  const path = `${GH.dir}/${rec.id}.json`;
  const content = b64enc(JSON.stringify(rec));
  const getUrl = `https://api.github.com/repos/${GH.repo}/contents/${path}?ref=${GH.branch}`;
  let sha;
  try { const ej = await apiJson(getUrl); sha = ej.sha; } catch (e) {}
  const body = sha
    ? { message: "update " + rec.id, content, sha, branch: GH.branch }
    : { message: "add " + rec.id, content, branch: GH.branch };
  await apiJson(`https://api.github.com/repos/${GH.repo}/contents/${path}`, {
    method: "PUT", headers: ghHeaders(), body: JSON.stringify(body)
  });
}
async function cloudDelete(id) {
  const path = `${GH.dir}/${id}.json`;
  const getUrl = `https://api.github.com/repos/${GH.repo}/contents/${path}?ref=${GH.branch}`;
  let sha;
  try { const ej = await apiJson(getUrl); sha = ej.sha; } catch (e) { return; }
  await apiJson(`https://api.github.com/repos/${GH.repo}/contents/${path}`, {
    method: "DELETE", headers: ghHeaders(),
    body: JSON.stringify({ message: "del " + id, sha, branch: GH.branch })
  });
}
async function cloudClearAll() {
  const url = `https://api.github.com/repos/${GH.repo}/contents/${GH.dir}?ref=${GH.branch}`;
  let arr;
  try { arr = await apiJson(url); } catch (e) { return; }
  if (!Array.isArray(arr)) return;
  for (const f of arr.filter(f => f.name.endsWith(".json"))) {
    try {
      const j = await apiJson(f.url);
      await apiJson(`https://api.github.com/repos/${GH.repo}/contents/${f.path}`, {
        method: "DELETE", headers: ghHeaders(),
        body: JSON.stringify({ message: "del all", sha: j.sha, branch: GH.branch })
      });
    } catch (e) {}
  }
}
async function syncPull() {
  setSync("同步中…");
  try {
    const recs = await cloudPull();
    const map = new Map();
    STATE.list.forEach(r => map.set(r.id, r));
    recs.forEach(r => map.set(r.id, r));
    STATE.list = [...map.values()].sort((a, b) =>
      (b.time || "").localeCompare(a.time || "") || (b._ts || 0) - (a._ts || 0));
    saveLocal(STATE.list);
    STATE.lastSync = new Date();
    setSync("已同步 " + STATE.lastSync.toLocaleString());
  } catch (e) {
    setSync("同步失败：" + e.message + "（显示本地缓存）", true);
  }
  renderList();
}
function loadLocal() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; } catch { return []; } }
function saveLocal(list) { try { localStorage.setItem(STORE_KEY, JSON.stringify(list)); } catch (e) { console.warn(e); } }

let selected = [];   // {name, qty}
let photos = [];     // dataURL strings
let editingId = null; // 正在编辑的记录 id（null = 新增）
let inSelected = []; // 入库弹窗中已选产品 {name, qty}

/* ---------- helpers ---------- */
const $ = (id) => document.getElementById(id);
function toast(msg, isErr) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (isErr ? " err" : "");
  setTimeout(() => (t.className = "toast"), 2200);
}
function nowLocal() {
  const d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}
function load() { return loadLocal(); }
function save(list) { saveLocal(list); }

/* ---------- time auto fill ---------- */
$("fillNow").onclick = () => ($("time").value = nowLocal());
$("time").value = nowLocal();

/* ---------- product search ---------- */
const searchEl = $("search"), suggestEl = $("suggest");
function renderSuggest() {
  const q = searchEl.value.trim().toLowerCase();
  const pool = PRODUCTS.filter(p => !selected.some(s => s.name === p) &&
    (q === "" || p.toLowerCase().includes(q)));
  suggestEl.innerHTML = "";
  if (!pool.length) { suggestEl.style.display = "none"; return; }
  pool.slice(0, 30).forEach(p => {
    const d = document.createElement("div");
    d.textContent = p;
    d.onclick = () => addProduct(p);
    suggestEl.appendChild(d);
  });
  suggestEl.style.display = "block";
}
function addProduct(name) {
  if (selected.some(s => s.name === name)) return;
  selected.push({ name, qty: 1 });
  searchEl.value = "";
  suggestEl.style.display = "none";
  renderSelected();
}
function renderSelected() {
  const box = $("selected");
  box.innerHTML = "";
  selected.forEach((it, i) => {
    const stock = getStock(it.name);
    const row = document.createElement("div");
    row.className = "sel-item";
    row.innerHTML =
      `<span class="name">${it.name}</span>` +
      `<span class="stock" style="font-size:12px;color:var(--muted);white-space:nowrap;">库存：${stock}</span>` +
      `<input type="number" min="0" step="any" value="${it.qty}" data-i="${i}" class="qty"/>` +
      `<span class="x" data-i="${i}">&times;</span>`;
    box.appendChild(row);
  });
  box.querySelectorAll(".qty").forEach(inp =>
    (inp.oninput = (e) => (selected[+e.target.dataset.i].qty = e.target.value)));
  box.querySelectorAll(".x").forEach(x =>
    (x.onclick = (e) => { selected.splice(+e.target.dataset.i, 1); renderSelected(); }));
  $("selHint").textContent = selected.length
    ? `已选 ${selected.length} 项货品，请逐项确认数量。`
    : "尚未选择货品，请在上方搜索并选择。";
}
searchEl.oninput = renderSuggest;
searchEl.onfocus = renderSuggest;
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search-wrap")) suggestEl.style.display = "none";
});

/* ---------- 入库弹窗：产品选择 ---------- */
const inSearchEl = $("inSearch"), inSuggestEl = $("inSuggest");
function renderInSuggest() {
  const q = inSearchEl.value.trim().toLowerCase();
  const pool = PRODUCTS.filter(p => !inSelected.some(s => s.name === p) &&
    (q === "" || p.toLowerCase().includes(q)));

  if (!pool.length) { inSuggestEl.style.display = "none"; return; }
  pool.slice(0, 30).forEach(p => {
    const d = document.createElement("div");
    d.textContent = p;
    d.onclick = () => addInProduct(p);

  });
  inSuggestEl.style.display = "block";
}
function addInProduct(name) {
  if (inSelected.some(s => s.name === name)) return;
  inSelected.push({ name, qty: 1 });
  inSearchEl.value = "";
  inSuggestEl.style.display = "none";
  renderInSelected();
}
function renderInSelected() {
  const box = $("inSelected");
  box.innerHTML = "";
  inSelected.forEach((it, i) => {
    const row = document.createElement("div");
    row.className = "sel-item";
    row.innerHTML =
      `<span class="name">${it.name}</span>` +
      `<input type="number" min="0" step="any" value="${it.qty}" data-i="${i}" class="qty"/>` +
      `<span class="x" data-i="${i}">&times;</span>`;
    box.appendChild(row);
  });
  box.querySelectorAll(".qty").forEach(inp =>
    (inp.oninput = (e) => (inSelected[+e.target.dataset.i].qty = e.target.value)));
  box.querySelectorAll(".x").forEach(x =>
    (x.onclick = (e) => { inSelected.splice(+e.target.dataset.i, 1); renderInSelected(); }));
  $("inSelHint").textContent = inSelected.length
    ? `已选 ${inSelected.length} 项货品，请逐项确认数量。`

}
inSearchEl.oninput = renderInSuggest;
inSearchEl.onfocus = renderInSuggest;
document.addEventListener("click", (e) => {
  if (!e.target.closest("#inModal .search-wrap")) inSuggestEl.style.display = "none";
});
function openInModal() {
  inSelected = [];
  renderInSelected();
  inSearchEl.value = "";
  $("inModal").classList.add("show");
  inSearchEl.focus();
}
$("inBtn").onclick = () => requirePw(() => openInModal(), "入库需要密码");
$("inCancel").onclick = () => $("inModal").classList.remove("show");
$("inModal").onclick = (e) => { if (e.target === $("inModal")) $("inModal").classList.remove("show"); };

/* ---------- 查看库存弹窗 ---------- */

  list.style.cssText = "display:flex;flex-direction:column;gap:8px;";

    row.innerHTML = `<span style="font-size:14px;">${esc(name)}</span><span style="font-size:14px;font-weight:600;color:var(--primary);">${getStock(name)}</span>`;

$("stockBtn").onclick = () => requirePw(() => openStockModal(), "查看库存需要密码");
$("stockClose").onclick = () => $("stockModal").classList.remove("show");
$("stockModal").onclick = (e) => { if (e.target === $("stockModal")) $("stockModal").classList.remove("show"); };
$("inConfirm").onclick = async () => {
  const items = inSelected
    .map(s => ({ name: s.name, qty: s.qty === "" ? 0 : Number(s.qty) }))
    .filter(s => s.name && s.qty > 0);
  if (!items.length) return toast("请至少选择一项货品", true);
  const rec = { id: genId(), time: nowLocal(), type: "in", items, _ts: Date.now() };
  STATE.list.unshift(rec);
  saveLocal(STATE.list);
  renderList();
  $("inModal").classList.remove("show");
  inSelected = [];
  renderInSelected();
  if (!GH.token) { toast("入库成功（已存本机）"); return; }
  toast("入库成功，正在同步到云端…");
  try {
    await pushAllLocal();
    STATE.lastSync = new Date();
    setSync("已同步 " + STATE.lastSync.toLocaleString());
  } catch (e) {
    setSync("云端同步失败：" + e.message + "（已存本地）", true);
  }
};

/* ---------- 历史记录自动补全（部门 / 领取人） ---------- */
function getHistory(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
function addHistory(key, val) {
  val = String(val || "").trim();
  if (!val) return;
  let arr = getHistory(key).filter(x => x !== val);
  arr.unshift(val);
  if (arr.length > 30) arr = arr.slice(0, 30);
  try { localStorage.setItem(key, JSON.stringify(arr)); } catch (e) {}
}
function setupHistorySuggest(inputId, suggestId, historyKey) {
  const inp = $(inputId), sug = $(suggestId);
  function render() {
    const q = inp.value.trim().toLowerCase();
    if (!q) { sug.style.display = "none"; return; }
    const matches = getHistory(historyKey).filter(v => v.toLowerCase().includes(q));
    if (!matches.length) { sug.style.display = "none"; return; }
    sug.innerHTML = "";
    matches.slice(0, 30).forEach(v => {
      const d = document.createElement("div");
      d.textContent = v;
      d.onmousedown = () => { inp.value = v; sug.style.display = "none"; };
      sug.appendChild(d);
    });
    sug.style.display = "block";
  }
  inp.addEventListener("input", render);
  inp.addEventListener("focus", () => { if (inp.value.trim()) render(); });
  inp.addEventListener("blur", () => setTimeout(() => { sug.style.display = "none"; }, 120));
}
setupHistorySuggest("dept", "deptSuggest", "outbound_dept_history");
setupHistorySuggest("picker", "pickerSuggest", "outbound_picker_history");

/* ---------- photo upload + compress ---------- */
const photoInput = $("photoInput"), photoDrop = $("photoDrop"), thumbs = $("thumbs");
photoDrop.onclick = () => photoInput.click();
photoDrop.ondragover = (e) => { e.preventDefault(); photoDrop.style.borderColor = "var(--primary)"; };
photoDrop.ondragleave = () => (photoDrop.style.borderColor = "var(--border)");
photoDrop.ondrop = (e) => {
  e.preventDefault(); photoDrop.style.borderColor = "var(--border)";
  handleFiles(e.dataTransfer.files);
};
photoInput.onchange = () => handleFiles(photoInput.files);

function handleFiles(fileList) {
  const files = [...fileList].filter(f => f.type.startsWith("image/"));
  if (!files.length) return;
  let pending = files.length;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = () => compress(reader.result, file.name, () => {
      if (--pending === 0) renderThumbs();
    });
    reader.readAsDataURL(file);
  });
  photoInput.value = "";
}
function compress(dataUrl, name, done) {
  const img = new Image();
  img.onload = () => {
    const max = 1280;
    let { width: w, height: h } = img;
    if (w > max || h > max) {
      const r = Math.min(max / w, max / h);
      w = Math.round(w * r); h = Math.round(h * r);
    }
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    canvas.getContext("2d").drawImage(img, 0, 0, w, h);
    // 估算体积：jpg 比 png 小很多
    const out = canvas.toDataURL("image/jpeg", 0.72);
    photos.push({ src: out, name });
    done();
  };
  img.onerror = () => done();
  img.src = dataUrl;
}
function renderThumbs() {
  thumbs.innerHTML = "";
  photos.forEach((p, i) => {
    const t = document.createElement("div");
    t.className = "thumb";
    t.innerHTML = `<img src="${p.src}" alt=""/><span class="del" data-i="${i}">&times;</span>`;
    t.querySelector(".del").onclick = (e) => { e.stopPropagation(); photos.splice(i, 1); renderThumbs(); };
    t.onclick = () => openModal(p.src);
    thumbs.appendChild(t);
  });
  const kb = Math.round(photos.reduce((s, p) => s + p.src.length * 0.75 / 1024, 0));
  $("photoMeta").textContent = photos.length ? `已选 ${photos.length} 张照片（约 ${kb} KB，已自动压缩）` : "";
}

/* ---------- modal ---------- */
const modal = $("modal");
function openModal(src) { $("modalImg").src = src; modal.classList.add("show"); }
$("modalClose").onclick = () => modal.classList.remove("show");
modal.onclick = (e) => { if (e.target === modal) modal.classList.remove("show"); };

/* ---------- submit ---------- */
$("submit").onclick = async () => {
  const time = $("time").value;
  const picker = $("picker").value.trim();
  const purpose = $("purpose").value.trim();
  if (!time) return toast("请填写领取时间", true);
  if (!picker) return toast("请填写领取人", true);
  if (!$("dept").value.trim()) return toast("请填写部门/领取单位（必填）", true);
  if (!purpose) return toast("请填写用途/项目（必填）", true);
  const items = selected
    .map(s => ({ name: s.name, qty: s.qty === "" ? 0 : Number(s.qty) }))
    .filter(s => s.name);
  if (!items.length) return toast("请至少选择一项货品", true);

  const wasEditing = !!editingId;
  const rec = {
    id: editingId || genId(), time, picker,
    dept: $("dept").value.trim(),
    purpose,
    items,
    photos: photos.map(p => p.src),
    _ts: Date.now()
  };
  if (editingId) {
    const idx = STATE.list.findIndex(r => r.id === editingId);
    if (idx >= 0) STATE.list[idx] = rec; else STATE.list.unshift(rec);
  } else {
    STATE.list.unshift(rec);
  }
  saveLocal(STATE.list);
  addHistory("outbound_dept_history", $("dept").value);
  addHistory("outbound_picker_history", picker);
  renderList();
  resetForm();
  if (!GH.token) {
    toast(wasEditing ? "修改已保存（本机）" : "登记成功（已存本机）");
    return;
  }
  toast(wasEditing ? "修改已保存，正在同步到云端…" : "登记成功，正在同步到云端…");
  try {
    await pushAllLocal();
    STATE.lastSync = new Date();
    setSync("已同步 " + STATE.lastSync.toLocaleString());
  } catch (e) {
    setSync("云端同步失败：" + e.message + "（已存本地）", true);
  }
};
$("reset").onclick = resetForm;
function resetForm() {
  $("picker").value = ""; $("purpose").value = ""; $("dept").value = "";
  $("time").value = nowLocal();
  selected = []; photos = []; editingId = null;
  $("submit").textContent = "提交登记";
  $("cancelEdit").style.display = "none";
  renderSelected(); renderThumbs();
}

/* ---------- list ---------- */
function renderList() {
  const list = STATE.list;
  $("count").textContent = list.length + " 条";
  const box = $("listBox");
  if (!list.length) {
    box.innerHTML = `<div class="empty">暂无记录，请先在上方登记。</div>`;
    return;
  }
  let html = `<table><thead><tr>
    <th>序号</th><th>时间</th><th>领取人</th><th>部门</th>
    <th>用途/项目</th><th>货物名称</th><th>数量</th><th>库存</th><th>照片</th><th>操作</th>
  </tr></thead><tbody>`;
  list.forEach((r, i) => {
    const itemsHtml = r.items.map((it, idx, arr) =>
      `<div class="item-line${arr.length > 1 ? ' multi-line' : ''}">${it.name} × ${it.qty}</div>`).join("");
    const stockHtml = r.items.map((it, idx, arr) =>
      `<div class="item-line${arr.length > 1 ? ' multi-line' : ''}">${getStock(it.name)}</div>`).join("");
    const qtySum = r.items.reduce((s, it) => s + (Number(it.qty) || 0), 0);
    const photoHtml = (r.photos && r.photos.length)
      ? r.photos.slice(0, 4).map(src =>
          `<img class="mini-photo" src="${src}" onclick="openModal('${src}')"/>`).join("") +
        (r.photos.length > 4 ? `<span class="badge">+${r.photos.length - 4}</span>` : "")
      : `<span class="badge">无</span>`;
    html += `<tr>
      <td>${list.length - i}</td>
      <td>${r.time || "-"}</td>
      <td>${esc(r.picker || "-")}</td>
      <td>${esc(r.dept || "-")}</td>
      <td>${esc(r.purpose || "-")}</td>
      <td class="items-cell">${itemsHtml}</td>
      <td>${qtySum}</td>
      <td class="items-cell">${stockHtml}</td>
      <td><div class="photos-cell">${photoHtml}</div></td>
      <td><button class="btn ghost sm" onclick="editRecord('${r.id}')">编辑</button> <button class="btn danger sm" onclick="del('${r.id}')">删除</button></td>
    </tr>`;
  });
  html += `</tbody></table>`;
  box.innerHTML = html;
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
window.openModal = openModal;

/* ---------- 密码保护：编辑 / 删除 / 清空全部 需密码 1111 ---------- */
let pwCallback = null;
function requirePw(cb, title) {
  pwCallback = cb;
  $("pwTitle").textContent = title || "此操作需要密码";
  $("pwErr").textContent = "";
  $("pwInput").value = "";
  $("pwModal").classList.add("show");
  setTimeout(() => $("pwInput").focus(), 50);
}
function doEdit(id) {
  const r = STATE.list.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  $("time").value = r.time || nowLocal();
  $("picker").value = r.picker || "";
  $("dept").value = r.dept || "";
  $("purpose").value = r.purpose || "";
  selected = (r.items || []).map(it => ({ name: it.name, qty: it.qty }));
  photos = (r.photos || []).map(src => ({ src, name: "" }));
  renderSelected(); renderThumbs();
  $("submit").textContent = "保存修改";
  $("cancelEdit").style.display = "inline-flex";
  window.scrollTo({ top: 0, behavior: "smooth" });
  toast("正在编辑该记录，修改后点「保存修改」");
}
async function doDelete(id) {
  if (!confirm("确定删除该条记录？删除后库存会自动恢复。")) return;
  STATE.list = STATE.list.filter(r => r.id !== id);
  saveLocal(STATE.list); renderList(); toast("已删除，库存已自动恢复");
  try { await cloudDelete(id); } catch (e) {}
}
async function doClearAll() {
  if (!confirm("将清空全部记录（含云端），且不可恢复。确定继续？")) return;
  try { await cloudClearAll(); } catch (e) {}
  STATE.list = []; saveLocal(STATE.list); renderList(); toast("已清空全部记录");
}
window.editRecord = (id) => requirePw(() => doEdit(id), "编辑需要密码");
window.del = (id) => requirePw(() => doDelete(id), "删除需要密码");
$("cancelEdit").onclick = () => { resetForm(); toast("已取消编辑"); };
$("clearAll").onclick = () => requirePw(() => doClearAll(), "清空全部记录需要密码");

/* 密码弹窗交互（仅点按钮时出现，无独立入口） */
$("pwConfirm").onclick = () => {
  if ($("pwInput").value === "1111") {
    $("pwModal").classList.remove("show");
    const cb = pwCallback; pwCallback = null;
    if (cb) cb();
  } else {
    $("pwErr").textContent = "密码错误，请重试";
  }
};
$("pwCancel").onclick = () => { $("pwModal").classList.remove("show"); pwCallback = null; };
$("pwModal").onclick = (e) => { if (e.target === $("pwModal")) { $("pwModal").classList.remove("show"); pwCallback = null; } };
$("pwInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("pwConfirm").click(); });
function toCsv(list) {
  const head = ["序号", "时间", "领取人", "部门", "用途/项目", "货物名称及数量", "库存", "照片数"];
  const rows = list.map((r, i) => {
    const items = r.items.map(it => `${it.name}×${it.qty}`).join("； ");
    const stocks = r.items.map(it => String(getStock(it.name))).join("； ");
    return [list.length - i, r.time || "", r.picker || "", r.dept || "", r.purpose || "", items, stocks, (r.photos || []).length];
  });
  const escCsv = v => {
    const s = String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  return [head, ...rows].map(row => row.map(escCsv).join(",")).join("\r\n");
}
function doExportCsv() {
  const list = STATE.list;
  if (!list.length) return toast("没有可导出的记录", true);
  const blob = new Blob(["﻿" + toCsv(list)], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "出库登记_" + new Date().toISOString().slice(0, 10) + ".csv";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("已导出 CSV");
}
$("exportBtn").onclick = () => requirePw(() => doExportCsv(), "导出 CSV 需要密码");
STATE.list = loadLocal();
renderList();
syncPull();
$("syncBtn").onclick = () => syncPull();
async function pushAllLocal() {
  let ok = 0, fail = 0;
  for (const r of STATE.list) {
    try { await cloudPush(r); ok++; } catch (e) { fail++; }
  }
  return { ok, fail };
}
