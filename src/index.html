<script>
  /* 应急回退：?legacy=1 直接跳转冻结的旧版单页 legacy.html */
  (function () {
    if (location.search.indexOf('legacy=1') !== -1) {
      location.replace('legacy.html' + location.hash);
    }
  })();

  /* 版本自检：GitHub Pages 无法下发 Cache-Control 头，页面长时间挂着可能跑旧版 JS。
     部署时把短 SHA 写入 <meta build-ver> 与 version.txt（见 deploy.yml），
     此处对比两者，不一致说明页面是旧版 → 强制 reload 拉到最新资源。
     注意：仅在「部署环境」（build-ver 是 8 位 SHA）生效；本地直开 index.html 时占位符未替换，跳过。 */
  (function () {
    var cur = (document.querySelector('meta[name="build-ver"]') || {}).getAttribute
      ? document.querySelector('meta[name="build-ver"]').getAttribute('content')
      : "";
    if (!cur || cur.indexOf("__") !== -1 || !/^[0-9a-f]{8}$/.test(cur)) return;
    var done = false;
    var lastCheck = 0;
    function check() {
      if (done) return;
      var now = Date.now();
      if (now - lastCheck < 300000) return;
      lastCheck = now;
      fetch("version.txt?_=" + now, { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (txt) {
          var ver = String(txt || "").trim();
          if (ver && ver !== cur) { done = true; location.reload(); }
        })
        .catch(function () {});
    }
    if (document.visibilityState === "visible") check();
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") check();
    });
    window.addEventListener("focus", check);
  })();

  /* PWA 离线：注册 Service Worker（优化 3）。
     仅部署环境注册（https + 非 file://）；本地直开跳过。
     注册失败静默（浏览器不支持 / 隐私模式等），不影响页面功能。 */
  (function () {
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost") return;
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  })();

  /* 全局错误兜底：任一模块抛错或资源 404 时，页面不再静默白屏，
     而是顶部弹出可关闭的错误条并给出旧版回退入口。
     刻意使用内联样式、不依赖任何外部 CSS/JS —— 样式表自身加载失败时也必须可见。 */
  (function () {
    var MAX = 3;                       // 最多同时展示 3 条，防错误风暴刷屏
    var seen = Object.create(null);
    var shown = 0;
    var bar = null;

    function ensureBar() {
      if (bar && bar.parentNode) return bar;
      if (!document.body) return null;
      bar = document.createElement('div');
      bar.id = 'fatal-error-bar';
      bar.setAttribute('role', 'alert');
      bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:99999;' +
        'font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;' +
        'padding:10px 12px;box-sizing:border-box;background:#fff2f0;color:#a8071a;' +
        'border-bottom:1px solid #ffccc7;box-shadow:0 2px 8px rgba(0,0,0,.08);' +
        'max-height:40vh;overflow:auto;';
      document.body.appendChild(bar);
      return bar;
    }

    function report(msg) {
      if (!msg) return;
      msg = String(msg).slice(0, 200);
      if (seen[msg]) return;           // 同一错误只报一次
      seen[msg] = 1;
      if (shown >= MAX) return;
      var host = ensureBar();
      if (!host) {                     // body 尚未解析，等 DOM 就绪后补报
        seen[msg] = 0;
        document.addEventListener('DOMContentLoaded', function () { report(msg); });
        return;
      }
      shown++;
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:flex-start;gap:8px;padding:2px 0;';
      var txt = document.createElement('span');
      txt.style.cssText = 'flex:1;word-break:break-all;';
      txt.textContent = '页面有部分功能未能正常加载：' + msg;
      var reload = document.createElement('a');
      reload.href = location.href;
      reload.textContent = '刷新重试';
      reload.style.cssText = 'color:#a8071a;font-weight:600;white-space:nowrap;';
      var legacy = document.createElement('a');
      legacy.href = '?legacy=1';
      legacy.textContent = '用旧版打开';
      legacy.style.cssText = 'color:#a8071a;font-weight:600;white-space:nowrap;';
      var close = document.createElement('button');
      close.type = 'button';
      close.textContent = '\u00d7';
      close.setAttribute('aria-label', '关闭提示');
      close.style.cssText = 'border:0;background:transparent;color:#a8071a;font-size:18px;line-height:1;cursor:pointer;padding:0 2px;';
      close.onclick = function () {
        if (row.parentNode) row.parentNode.removeChild(row);
        if (bar && !bar.children.length && bar.parentNode) { bar.parentNode.removeChild(bar); bar = null; }
      };
      row.appendChild(txt); row.appendChild(reload); row.appendChild(legacy); row.appendChild(close);
      host.appendChild(row);
    }

    window.addEventListener('error', function (e) {
      // 资源加载失败不冒泡到 window.onerror，只能在捕获阶段从 e.target 识别
      var t = e.target;
      if (t && t !== window && (t.tagName === 'SCRIPT' || t.tagName === 'LINK' || t.tagName === 'IMG')) {
        var url = t.src || t.href || '';
        report('资源加载失败 ' + url.split('/').slice(-2).join('/'));
        return;
      }
      report((e.message || '未知错误') +
        (e.lineno ? ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno : ''));
    }, true);

    window.addEventListener('unhandledrejection', function (e) {
      var r = e && e.reason;
      report('异步操作失败：' + ((r && (r.message || r.msg)) || r || '未知原因'));
    });

    window.__reportFatal = report;     // 供 main.js 启动失败时复用
  })();

       任何设备打开即自带写入能力。localStorage 中的 gh_token 仅作兜底。
       注意：变量名 window.__GH_TOKEN__ 保持不变（外部 config.js 依赖它），
       仅替换下方赋值语句的值占位符，避免 perl 全局替换误伤变量名。
       此占位必须保持内联脚本，不得移入外部 js / 构建产物。 -->
  <script>
