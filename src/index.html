<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>出入库登记表</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/views.css" />
<script>
  /* 应急回退：?legacy=1 直接跳转冻结的旧版单页 legacy.html */
  (function () {
    if (location.search.indexOf('legacy=1') !== -1) {
      location.replace('legacy.html' + location.hash);
    }
  })();
</script>
</head>
<body>
  <!-- 三段式视图容器：落地页 / 验证页 / 应用页 -->
  <div id="view-landing" class="view-page"></div>
  <div id="view-verify" class="view-page" style="display:none"></div>
  <div id="view-app" class="view-page" style="display:none"></div>

  <!-- 弹窗与提示容器 -->
  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <!-- 云端令牌：由部署 workflow 用 perl 将 __GH_TOKEN__ 替换为仓库密匙（Secrets.GH_TOKEN），
       任何设备打开即自带写入能力。localStorage 中的 gh_token 仅作兜底。
       此占位必须保持内联脚本，不得移入外部 js / 构建产物。 -->
  <script>
    window.__GH_TOKEN__ = "__GH_TOKEN__";
  </script>

  <!-- 经典 <script> 顺序加载（不用 ES Module，保证 file:// 调试与加载顺序） -->
  <script src="qrcode.js"></script>
  <script src="js/core/config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/store.js"></script>
  <script src="js/data/stock.js"></script>
  <script src="js/data/cloud.js"></script>
  <script src="js/data/records.js"></script>
  <script src="js/auth/auth.js"></script>
  <script src="js/router/router.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/views/landing.js"></script>
  <script src="js/views/verify.js"></script>
  <script src="js/views/app.js"></script>
  <script src="js/views/out.js"></script>
  <script src="js/views/in.js"></script>
  <script src="js/views/stock.js"></script>
  <script src="js/views/records.js"></script>
  <script src="js/views/report.js"></script>
  <script src="js/views/sync.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
