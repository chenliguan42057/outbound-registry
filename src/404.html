<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>页面未找到 · 进销存管理系统</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    :root { --mint:#6FA08A; --ink:#3C4845; --muted:#74837E; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(160deg, #F1F8F4, #FBF9F3 45%, #F0F6F5);
      color: var(--ink);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .box {
      background: rgba(253,252,249,.92);
      border: 1px solid #DCE6E0;
      border-radius: 24px;
      box-shadow: 0 12px 34px rgba(87,130,111,.13);
      padding: 40px 36px; max-width: 360px; width: 100%;
    }
    .code {
      font-size: 64px; font-weight: 800; line-height: 1;
      background: linear-gradient(135deg, #A79ED0, #7FB3A5);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      margin-bottom: 12px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 22px; }
    .btn {
      display: inline-block; text-decoration: none;
      background: linear-gradient(135deg, #6FA08A, #57826F);
      color: #fff; font-size: 15px; font-weight: 600;
      padding: 12px 22px; border-radius: 14px;
      box-shadow: 0 6px 18px rgba(87,130,111,.28);
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>没有找到这个页面</h1>
    <p>链接可能已失效，或页面已被移动。<br/>返回首页即可继续使用进销存系统。</p>
    <a class="btn" href="./">返回进销存系统</a>
  </div>
</body>
</html>
