name: Batch Sluggish Report
on:
  schedule:
    # 每周五 16:00（北京时间 = UTC 08:00）；GitHub cron 使用 UTC 时区
    - cron: '0 8 * * 5'
  workflow_dispatch:   # 支持手动触发测试

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python + openpyxl
        run: pip install --quiet openpyxl
      - name: Send batch sluggish report to DingTalk
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SECRET: ${{ secrets.DINGTALK_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python3 .github/scripts/batch_report.py
