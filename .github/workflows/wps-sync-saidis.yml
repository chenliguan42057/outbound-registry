name: WPS 轻维表同步 小鹿产品登记 (赛迪斯)
# 链接提交 → 写 GitHub → 本 Action 自动把鹿茸记录推送到金山轻维表（照台账格式追加一行）
# 链接删除 → 写删除墓碑 data-saidis/deleted/ → 本 Action 把金山对应那一行也删掉并重算下游库存
on:
  push:
    branches: [ main ]
    paths:
      - 'data-saidis/records/*.json'
      - 'data-saidis/deleted/*.json'
  # 兜底扫描：每小时补同步「因并发被取消/网络失败」而漏掉的记录（已同步的靠标记跳过，不会重复写）
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: '全量回填：处理 data-saidis/records/ 下所有历史记录（一次性补漏）'
        required: false
        default: 'false'

# 需要写权限来回写同步标记文件 .wps_synced_saidis.json（该提交路径非 data-saidis/records，不会再次触发本 workflow）
permissions:
  contents: write

# 串行执行：金山脚本靠「读上一行库存」来算新库存，并发会读到同一个旧值导致库存算错。
# cancel-in-progress:false 让后来的排队等待而非插队；万一排队被挤掉，上面的每小时兜底扫描会补上。
concurrency:
  group: wps-sync-saidis
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 需要历史 diff 出本次变更的记录文件
      - name: Get changed record files
        id: changed
        run: |
          # 同时盯两个目录：records=新增行，deleted=删除行
          if [ "${{ github.event_name }}" = "push" ]; then
            # 用 event.before..sha 全范围 diff（合并 push 会吞前序 commit 变更，导致漏同步）
            FILES=$(git diff --name-status ${{ github.event.before }} ${{ github.sha }} -- 'data-saidis/records/*.json' 'data-saidis/deleted/*.json' || true)
          elif [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.backfill }}" = "true" ]; then
            # 全量扫描：列出所有记录/墓碑文件标记为新增；已处理的会被 .wps_synced_saidis.json 跳过，不会重复写/重复删
            FILES=$(git ls-tree -r --name-only HEAD -- 'data-saidis/records/*.json' 'data-saidis/deleted/*.json' | sed 's/^/A\t/' || true)
          else
            FILES=$(git diff-tree --no-commit-id --name-status -r HEAD~1 -- 'data-saidis/records/*.json' 'data-saidis/deleted/*.json' || true)
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Sync to WPS AirScript
        env:
          DATA_PREFIX: data-saidis
          MARKER_FILE: .wps_synced_saidis.json
          WEBHOOK: ${{ secrets.WPS_AIRSCRIPT_WEBHOOK_SAIDIS }}
          AIRSCRIPT_TOKEN: ${{ secrets.WPS_AIRSCRIPT_TOKEN_SAIDIS }}
          FILES: ${{ steps.changed.outputs.files }}
          BACKFILL: ${{ github.event_name == 'schedule' && 'true' || inputs.backfill }}
        run: python3 .github/scripts/wps_sync.py
      - name: Commit sync marker
        if: always()
        run: |
          if [ ! -f .wps_synced_saidis.json ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .wps_synced_saidis.json
          if git diff --cached --quiet; then
            echo "标记无变化，跳过提交"; exit 0
          fi
          git commit -m "chore: update wps sync marker"
          # 并发时别的 run 可能已推过 → 冲突要「两边取并集」，不能二选一，否则标记丢失会重复写金山
          for i in 1 2 3 4 5; do
            if git push; then echo "标记已提交(第 $i 次尝试)"; exit 0; fi
            echo "推送冲突，第 $i 次合并重试…"
            cp .wps_synced_saidis.json /tmp/mine.json
            git fetch origin main
            git reset --hard origin/main
            python3 - <<'PY'
          import json, os
          mine = json.load(open('/tmp/mine.json', encoding='utf-8'))
          try:
              theirs = json.load(open('.wps_synced_saidis.json', encoding='utf-8'))
          except Exception:
              theirs = {}
          # 两边取并集。注意 __del__/__fail__/__bad__ 是嵌套字典，
          # 直接 update 会把对方整块覆盖掉 → 已删记录的标记丢失 → 兜底扫描会重复删。所以要下钻一层。
          merged = dict(theirs)
          for k, v in mine.items():
              if isinstance(v, dict) and isinstance(merged.get(k), dict) and str(k).startswith('__'):
                  sub = dict(merged[k]); sub.update(v); merged[k] = sub
              else:
                  merged[k] = v
          json.dump(merged, open('.wps_synced_saidis.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('合并标记: 本地%d + 远程%d -> %d' % (len(mine), len(theirs), len(merged)))
          PY
            git add -f .wps_synced_saidis.json
            git diff --cached --quiet && { echo "合并后无差异，无需提交"; exit 0; }
            git commit -m "chore: update wps sync marker (merged)"
            sleep $((i * 2))
          done
          echo "::warning::标记提交失败，已同步的记录可能被重复写入，请检查金山是否有重复行"
          exit 0
