name: Deploy Pages
on:
  push:
    branches: [main]
    # 数据文件由前端与其他 Action 高频写入（每提交一条出库单就是一次 commit）。
    # 若不排除，每条业务数据都会触发一次全站重新部署；而下面的
    # concurrency.cancel-in-progress 会把正在进行的部署直接取消，
    # 高峰期表现为「连续提交多条，站点却迟迟不更新」。
    # 部署产物只有 src/（见下方 cp -r src/. dist/），data/ 与 data-saidis/
    # （双仓库：深圳细胞 / 赛迪斯）根本不参与打包，忽略它们不会让站点内容失真。
    paths-ignore:
      - 'data/**'
      - 'data-saidis/**'
      - 'docs/**'
      - '**.md'
      - '.wps_synced.json'
      - '_local_marker.json'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject cloud token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail

          # 前置校验：Secret 缺失时 perl 会把占位符替换成空串，部署照常"成功"，
          # 但线上站点云同步全废。宁可让部署失败，也不要发布一个坏站点。
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::仓库 Secret GH_TOKEN 未配置或为空，注入后云同步将完全不可用，已中止部署。"
            exit 1
          fi

          mkdir -p dist
          perl -pi -e 's/__GH_TOKEN_PLACEHOLDER__/$ENV{GH_TOKEN}/g' src/index.html src/legacy.html src/lurong.html

          # 静态资源指纹：把 index.html 里的 __CACHE_BUST__ 换成短 git SHA，
          # 让 GitHub Pages 的强缓存（max-age=600）在发版后立即失效、拉到新资源。
          SHA=$(printf '%s' "${GITHUB_SHA:-}" | cut -c1-8)
          perl -pi -e "s/__CACHE_BUST__/$SHA/g" src/index.html
          # PWA Service Worker 同样注入指纹（缓存名版本化，发版自动清理旧缓存）
          perl -pi -e "s/__CACHE_BUST__/$SHA/g" src/sw.js

          # 版本探针：部署产物里写 version.txt = 短 SHA。
          # index.html 内联版本自检脚本（<meta name="build-ver"> + fetch version.txt）
          # 检测到不一致说明页面跑的是旧版 → 强制 reload，绕开无法自定义的 GitHub Pages 缓存。
          cp -r src/. dist/
          printf '%s' "$SHA" > dist/version.txt

          # 后置校验：任一注入文件仍残留「赋值语句里的令牌占位符」，说明替换没生效
          # （文件改名、编码异常等），同样属于"发布出去就是坏的"，必须拦下。
          # 注意：只匹配 window.__GH_TOKEN__ = "__GH_TOKEN_PLACEHOLDER__" 这种真实赋值，
          # 不要用裸 grep 全文——注释里出现占位符字样会误判，导致正常部署被中止。
          if grep -rn 'window.__GH_TOKEN__ *= *"__GH_TOKEN_PLACEHOLDER__"' src/index.html src/legacy.html src/lurong.html ; then
            echo "::error::令牌占位符替换失败，上列文件仍有残留，已中止部署。"
            exit 1
          fi

          if ! grep -q 'build-ver' src/index.html || ! [ -s dist/version.txt ]; then
            echo "::error::版本探针缺失（build-ver meta 或 version.txt），已中止部署。"
            exit 1
          fi

          # PWA 校验：sw.js 必须存在且指纹已注入（残留占位符说明替换失败）
          if ! [ -f src/sw.js ] || grep -q '__CACHE_BUST__' src/sw.js ; then
            echo "::error::Service Worker 缺失或指纹未注入，已中止部署。"
            exit 1
          fi

          # 优化完整性校验（2026-08-10 新增）：防止用户端旧工作区 sync 工具
          # 回滚 src/ 关键文件后仍"静默部署成功"（曾发生：sync 推送旧 cloud.js 等
          # 覆盖照片加固/增量拉取优化）。关键优化标记缺失即中止部署 + 告警。
          if ! grep -q 'pushPhotoWithRetry' src/js/data/cloud.js || \
             ! grep -q 'slimRecord' src/js/data/cloud.js || \
             ! grep -q 'fetchTree' src/js/data/cloud.js ; then
            echo "::error::检测到 cloud.js 被回滚（缺照片加固/增量拉取优化标记），疑似旧工作区 sync 覆盖，已中止部署。"
            exit 1
          fi
          if ! grep -q 'capture="environment"' src/js/ui/components.js ; then
            echo "::error::检测到 components.js 被回滚（缺拍照直调优化标记），已中止部署。"
            exit 1
          fi
          if ! grep -q 'DEFAULT_ENTITY' src/js/views/out.js ; then
            echo "::error::检测到 out.js 被回滚（缺出货仓库单位二选一优化标记），已中止部署。"
            exit 1
          fi
          if ! grep -q 'wireOnlineOffline' src/js/views/app.js || ! grep -q 'sw.js' src/index.html ; then
            echo "::error::检测到 PWA 离线优化被回滚（缺 wireOnlineOffline / SW 注册），已中止部署。"
            exit 1
          fi

          # 第二轮优化完整性校验（2026-08-10 下午）：跨设备同步回归修复 + 数据不丢 + 性能 + 回收站。
          # 这些改动分散在多个文件，任何一个被旧工作区覆盖都会造成"看起来正常、实际丢数据"，
          # 所以每一项都单独校验、缺一即中止。
          if ! grep -q 'pullTombstones()' src/js/data/cloud.js || \
             ! grep -q 'enqueueTomb' src/js/data/cloud.js || \
             ! grep -q 'delTombstone' src/js/data/cloud.js ; then
            echo "::error::检测到 cloud.js 被回滚（缺跨设备同步修复/墓碑队列/回收站支持），已中止部署。"
            exit 1
          fi
          if ! grep -q 'deletedAt' src/js/data/records.js || \
             ! grep -q 'newerOf' src/js/data/records.js || \
             ! grep -q 'function restore' src/js/data/records.js ; then
            echo "::error::检测到 records.js 被回滚（缺 clear-all 时间窗/冲突取较新/回收站还原），已中止部署。"
            exit 1
          fi
          if ! grep -q 'buildStockIndex' src/js/data/stock.js ; then
            echo "::error::检测到 stock.js 被回滚（缺库存预计算索引），已中止部署。"
            exit 1
          fi
          if ! [ -f src/js/views/trash.js ] || ! grep -q 'views/trash.js' src/index.html ; then
            echo "::error::检测到回收站视图缺失或未在 index.html 注册，已中止部署。"
            exit 1
          fi
          if ! grep -q 'recBulkDel' src/js/views/records.js ; then
            echo "::error::检测到记录列表批量操作被回滚，已中止部署。"
            exit 1
          fi
          if ! grep -q 'inHandler' src/js/views/in.js ; then
            echo "::error::检测到入库经办人字段被回滚，已中止部署。"
            exit 1
          fi
          if ! [ -f src/js/views/push.js ] || ! grep -q 'views/push.js' src/index.html || ! grep -q 'pushmenu' src/js/views/push.js ; then
            echo "::error::检测到推送信息视图缺失/未注册/或核心逻辑被回滚，已中止部署。"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
