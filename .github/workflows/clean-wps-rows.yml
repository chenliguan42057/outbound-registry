name: Clean WPS rows (manual)
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: '输入 yes 确认执行清理（删除金山台账指定行）'
        required: true
        default: 'no'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run cleanup script
        env:
          WEBHOOK: ${{ secrets.WPS_AIRSCRIPT_WEBHOOK }}
          AIRSCRIPT_TOKEN: ${{ secrets.WPS_AIRSCRIPT_TOKEN }}
        run: python3 .github/scripts/clean_wps_rows.py
      - name: Commit sync marker
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .wps_synced.json
          if git diff --cached --quiet; then echo "标记无变化"; exit 0; fi
          git commit -m "chore: wps cleanup marker"
          for i in 1 2 3; do
            if git push; then echo "标记已提交"; exit 0; fi
            sleep $((i * 2))
          done
          echo "::warning::标记提交失败"
