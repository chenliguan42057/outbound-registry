name: Audit Report Notify
on:
  # ⛔ 2026-09-23 按主理人要求停用定时推送（恢复：删掉本行，并把下方 "# schedule:" 与 "# - cron:" 行行首的 "# " 去掉即可）
  # schedule:
    # UTC 06:00 = 北京时间 14:00，每周五——比待处理提醒（北京 13:00 触发）晚 1 小时。
    # GitHub Actions schedule 常延迟数小时，两者延迟相近，仍保持先后顺序。
    # - cron: '0 6 * * 5'
  workflow_dispatch:      # 支持手动触发即时推送

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push audit report to DingTalk
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SECRET: ${{ secrets.DINGTALK_SECRET }}
          SYS_NAME: '深圳细胞'
        run: python3 .github/scripts/audit_report_push.py
