name: Pending Reminder
on:
  schedule:
    - cron: '5 9 * * *'   # UTC 09:05 = 北京时间 17:05（"五点整后"）
  workflow_dispatch:      # 支持手动触发测试

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send pending reminder
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python3 .github/scripts/pending_reminder.py
