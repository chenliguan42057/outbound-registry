name: Pending Reminder
on:
  schedule:
    # UTC 08:00 = 北京时间 16:00（期望推送时刻；schedule 仅作兜底——实测 GitHub 可能延迟数小时）
    - cron: '0 8 * * *'
  workflow_dispatch:      # 支持手动触发测试 + 外部 cron（cron-job.org）主触发（即时、无延迟）

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send pending reminder
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python3 .github/scripts/pending_reminder.py
