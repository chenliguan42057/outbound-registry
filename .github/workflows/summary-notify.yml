name: Summary Notify
on:
  workflow_dispatch:   # 手动触发：推送优化总结 / 功能说明到钉钉群
    inputs:
      script:
        description: '推送脚本（不带 .py）'
        required: false
        default: 'send_summary'
        type: choice
        options:
          - send_summary
          - send_borrow_explain

jobs:
  summary:
    if: false   # ⛔ 2026-10-29 主理人要求：切断钉钉推送（恢复：把 false 改回 true 或删本行）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send card
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SECRET: ${{ secrets.DINGTALK_SECRET }}
          SYS_NAME: '深圳细胞'
        run: python3 .github/scripts/${{ inputs.script }}.py
