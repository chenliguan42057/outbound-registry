name: DingTalk Notify
on:
  push:
    branches: [ main ]
    paths:
      - 'data/records/*.json'
  workflow_dispatch:   # 支持手动触发测试（默认发一条测试消息）

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 需要历史 diff 出变更文件
      - name: Get changed record files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            FILES=$(git diff-tree --no-commit-id --name-only -r ${{ github.sha }} -- 'data/records/*.json' || true)
          else
            FILES=$(git log -1 --name-only --format= -- 'data/records/*.json' || true)
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Send DingTalk
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SECRET: ${{ secrets.DINGTALK_SECRET }}
          FILES: ${{ steps.changed.outputs.files }}
        run: python3 .github/scripts/dingtalk_notify.py
