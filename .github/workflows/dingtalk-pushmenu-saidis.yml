name: DingTalk Pushmenu (赛迪斯)

on:
  push:
    branches: [ main ]
    paths:
      - 'data-saidis/notify/pushmenu/*.json'
  workflow_dispatch:   # 手动触发测试：扫描最近 3 个待发文件

jobs:
  pushmenu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # 需要历史 diff 出变更文件
      - name: Get changed pushmenu files
        id: changed
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            FILES=$(git diff --name-status ${{ github.event.before }} ${{ github.sha }} -- 'data-saidis/notify/pushmenu/*.json' || true)
          else
            FILES=$(git ls-tree -r --name-only HEAD -- data-saidis/notify/pushmenu | grep '\.json$' | tail -3 | sed 's|^|A\t|' || true)
          fi
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Send DingTalk Pushmenu
        env:
          DATA_PREFIX: data-saidis
          SYS_NAME: '赛迪斯'
          KEYWORD: '赛迪斯'
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK_SAIDIS }}
          SECRET: ${{ secrets.DINGTALK_SECRET_SAIDIS }}
          FILES: ${{ steps.changed.outputs.files }}
        run: python3 .github/scripts/dingtalk_pushmenu.py
