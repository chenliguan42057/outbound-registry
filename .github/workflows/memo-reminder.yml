name: Memo Reminder
on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟跑一次，脚本内按配置提醒时间（HH:MM）匹配，匹配才推送
  workflow_dispatch:      # 支持手动触发测试（同样按时间匹配，避免时间窗口外干扰推送）

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send memo reminder
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python3 .github/scripts/memo_reminder.py
