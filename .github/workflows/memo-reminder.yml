name: Memo Reminder
on:
  schedule:
    - cron: '*/1 * * * *'   # 每分钟跑一次；脚本内按配置提醒时间+容忍窗口匹配，当日去重
  workflow_dispatch:
    inputs:
      force:
        description: '强制推送（跳过时间匹配与当日去重，供手动测试/补推）'
        required: false
        default: 'false'
        type: boolean

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send memo reminder
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SECRET: ${{ secrets.DINGTALK_SECRET }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: python3 .github/scripts/memo_reminder.py
