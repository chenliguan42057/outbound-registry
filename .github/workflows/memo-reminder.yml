name: Memo Reminder
on:
  schedule:
    - cron: '0 1 * * *'   # UTC 01:00 = 北京时间 9:00
  workflow_dispatch:      # 支持手动触发测试

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send memo reminder
        env:
          WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          SECRET: ${{ secrets.DINGTALK_SECRET }}
        run: python3 .github/scripts/memo_reminder.py
